<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Pack Opener</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <section id="menu-screen" class="screen menu-screen is-active" aria-label="Main menu">
      <div class="menu-hero">
        <p class="eyebrow">Pokemon Pack Opener</p>
        <h1>Pokemon Pack Opener</h1>

        <div class="menu-actions">
          <button id="open-pack-button" class="primary-button big-button" type="button">Packs</button>
          <button id="open-collection-button" class="secondary-button big-button" type="button">Collection</button>
        </div>
      </div>

      <div class="menu-sidebar">
        <section class="booklet-panel" aria-label="Booklet shelf">
          <div class="booklet-panel-header">
            <div>
              <p class="eyebrow">Booklets</p>
              <h2 id="booklet-active-name">Your Cards</h2>
            </div>
          </div>
          <div id="booklet-preview" class="booklet-preview"></div>
        </section>
      </div>
    </section>

    <section id="packs-screen" class="screen packs-screen" aria-label="Packs">
      <header class="packs-header">
        <div class="collection-heading">
          <button id="packs-back-button" class="secondary-button" type="button">Menu</button>
          <div>
            <p class="eyebrow">Choose a pack</p>
            <h2>Packs</h2>
          </div>
        </div>
        <input id="packs-search-input" class="collection-search-input" type="search" autocomplete="off" placeholder="Search packs or series" aria-label="Search packs">
      </header>

      <div class="packs-layout">
        <div id="packs-grid" class="packs-grid" aria-label="Pack list"></div>
        <aside id="pack-detail" class="pack-detail" aria-label="Pack details"></aside>
      </div>
    </section>

    <section id="pack-screen" class="screen pack-screen" aria-label="Pack opening">
      <div id="pack-fade-overlay" class="pack-fade-overlay" aria-hidden="true"></div>

      <div class="pack-topline">
        <span id="pack-progress" class="pack-progress">0 / 10</span>
        <p id="pack-instruction" class="pack-instruction">Click the pack to reveal the next card.</p>
      </div>

      <div class="pack-stage-shell">
        <button id="pack-stage" class="pack-stage" type="button" aria-live="polite">
          <div id="pack-stage-content" class="pack-stage-content"></div>
        </button>
        <div id="pack-summary-heading" class="pack-summary-heading" aria-live="polite"></div>
      </div>

      <div id="revealed-tray" class="revealed-tray"></div>

      <div id="pack-summary-actions" class="pack-summary-actions">
        <button id="pack-open-another-button" class="corner-button" type="button">Open Another</button>
        <button id="pack-back-to-packs-button" class="corner-button secondary-corner-button" type="button">Back to Pack Page</button>
      </div>
    </section>

    <section id="collection-screen" class="screen collection-screen" aria-label="Collection">
      <header class="collection-header">
        <div class="collection-heading">
          <button id="collection-back-button" class="secondary-button" type="button">Menu</button>
          <div>
            <p class="eyebrow">Your Collection</p>
            <h2>Every card you have pulled lives here.</h2>
          </div>
        </div>

        <div class="collection-summary">
          <article class="stat-card compact">
            <span>Packs opened</span>
            <strong id="collection-packs-opened-count">0</strong>
          </article>
          <article class="stat-card compact">
            <span>Cards found</span>
            <strong id="collection-saved-count">0</strong>
          </article>
          <article class="stat-card compact">
            <span>Favorited</span>
            <strong id="collection-favorite-count">0</strong>
          </article>
          <article class="stat-card compact">
            <span>Booklets</span>
            <strong id="collection-booklet-count">0</strong>
          </article>
        </div>

        <div class="collection-controls">
          <button id="all-filter-button" class="filter-button is-active" type="button">All Cards</button>
          <button id="favorites-filter-button" class="filter-button" type="button">Favorites</button>
          <input id="collection-search-input" class="collection-search-input" type="search" autocomplete="off" placeholder="Search Pokemon" aria-label="Search collection">
          <label class="collection-sort-shell">
            <span>Sort</span>
            <select id="collection-sort-select" aria-label="Sort collection">
              <option value="price-desc">Price High to Low</option>
              <option value="price-asc">Price Low to High</option>
              <option value="favorites">Favorited</option>
              <option value="booklet">By Booklet</option>
            </select>
          </label>
          <button id="refresh-prices-button" class="secondary-button" type="button">Refresh Prices</button>
          <button id="clear-collection-button" class="secondary-button danger-button" type="button">Clear Collection</button>
        </div>
      </header>

      <p id="pricing-status" class="pricing-status">Loading collection...</p>
      <div id="collection-grid" class="collection-grid"></div>
    </section>

    <div id="card-zoom-modal" class="card-zoom-modal" aria-hidden="true">
      <button id="card-zoom-backdrop" class="card-zoom-backdrop" type="button" aria-label="Close card zoom"></button>
      <div class="card-zoom-shell">
        <button id="card-zoom-close" class="card-zoom-close" type="button">Close</button>
        <div id="card-zoom-content" class="card-zoom-content"></div>
      </div>
    </div>
  </div>

  <script src="./data/cards.js"></script>
  <script src="./app.js"></script>
</body>
</html>
